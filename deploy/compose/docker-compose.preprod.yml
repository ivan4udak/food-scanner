# ─────────────────────────────────────────────────────────────────────────
# PRE-PRODUCTION (ветка main). Самостоятельный стек, изолированный от staging/prod.
# Образы из GHCR; секреты в ./app.env; вход через Caddy (foodscanner-edge);
# на хост маппится только web (loopback:10790).
# ─────────────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-preprod
    restart: unless-stopped
    env_file: ./app.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - preprod_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio
    container_name: minio-preprod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ./app.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - preprod_miniodata:/data
    networks: [internal]
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-preprod
    restart: unless-stopped
    env_file: ./app.env
    environment:
      APP_ENV: preprod
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 45s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE}
    container_name: web-preprod
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend-preprod:8080
    depends_on:
      - backend
    networks: [internal, edge]
    ports:
      - "127.0.0.1:10790:80"
    logging: *default-logging

volumes:
  preprod_pgdata:
    name: preprod_pgdata
  preprod_miniodata:
    name: preprod_miniodata

networks:
  internal:
    name: preprod-internal
  edge:
    external: true
    name: foodscanner-edge
