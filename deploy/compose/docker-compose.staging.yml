# ─────────────────────────────────────────────────────────────────────────
# STAGING (ветка test). Самостоятельный стек: свои контейнеры, volume, сеть.
# Образы приходят готовыми из GHCR (BACKEND_IMAGE/WEB_IMAGE экспортит deploy.sh).
# Секреты — в ./app.env (chmod 600, не в репозитории). Публичный вход — через Caddy
# по сети foodscanner-edge; на хост наружу маппится только web (loopback:10690).
# ─────────────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-staging
    restart: unless-stopped
    env_file: ./app.env   # POSTGRES_DB/USER/PASSWORD приходят отсюда
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # MinIO общий для всех окружений (стек docker-compose.minio.yml), доступен по
  # сети foodscanner-edge как `minio`. Bucket этого окружения — в app.env (MINIO_BUCKET).
  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-staging
    restart: unless-stopped
    env_file: ./app.env
    environment:
      APP_ENV: staging
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 45s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE}
    container_name: web-staging
    restart: unless-stopped
    environment:
      # Резерв: Caddy сам маршрутизирует /api -> backend; этот proxy bypass'ится.
      BACKEND_URL: http://backend-staging:8080
    depends_on:
      - backend
    networks: [internal, edge]
    ports:
      - "127.0.0.1:10690:80"   # прямой доступ для отладки (основной путь — Caddy)
    logging: *default-logging

  # ── OCR (v1.10) — очередь + сервис. Активируется при rollout: образ OCR_IMAGE,
  #    в app.env: OCR_AMQP_ENABLED=true, SPRING_RABBITMQ_HOST=rabbitmq-staging,
  #    RABBITMQ_DEFAULT_USER/PASS, RABBIT_URL=amqp://<user>:<pass>@rabbitmq-staging:5672/. ──
  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: rabbitmq-staging
    restart: unless-stopped
    env_file: ./app.env
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
    logging: *default-logging

  ocr:
    image: ${OCR_IMAGE}
    container_name: ocr-staging
    restart: unless-stopped
    env_file: ./app.env   # MINIO_* / RABBIT_* — те же, что у backend (одно хранилище/брокер)
    environment:
      OCR_ENGINE: ${OCR_ENGINE:-easyocr}
      OCR_WORKER_CONCURRENCY: ${OCR_WORKER_CONCURRENCY:-1}
      OCR_LANGS: ${OCR_LANGS:-ru,en}
      OCR_JOB_TIMEOUT_SECONDS: ${OCR_JOB_TIMEOUT_SECONDS:-120}
      OCR_IMAGE_DOWNLOAD_TIMEOUT_SECONDS: ${OCR_IMAGE_DOWNLOAD_TIMEOUT_SECONDS:-30}
    # лимит памяти: при OOM Docker убьёт ocr-staging, не задев stable/production на этом же хосте
    mem_limit: 1800m
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks: [internal, edge]
    logging: *default-logging

volumes:
  staging_pgdata:
    name: staging_pgdata

networks:
  internal:
    name: staging-internal
  edge:
    external: true
    name: foodscanner-edge
