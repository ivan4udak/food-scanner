# ─────────────────────────────────────────────────────────────────────────
# PRODUCTION (ветка release). In-place деплой (без blue-green) — сервер 2GB/2c
# не вмещает два prod-JVM одновременно. Деплой: остановить старый backend, поднять
# новый, health-check; при провале — откат к предыдущему образу (releases.log).
# Кратковременный простой (~30–60с) на время старта новой версии.
# ─────────────────────────────────────────────────────────────────────────
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-production
    restart: unless-stopped
    env_file: ./app.env   # POSTGRES_DB/USER/PASSWORD приходят отсюда
    volumes:
      - production_pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # MinIO общий (стек docker-compose.minio.yml), доступен по сети foodscanner-edge
  # как `minio`. Bucket production задаётся в app.env (MINIO_BUCKET=food-images-production).
  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-production
    restart: unless-stopped
    env_file: ./app.env
    environment:
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/ping >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 45s
    logging: *default-logging

  web:
    image: ${WEB_IMAGE}
    container_name: web-production
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend-production:8080
    depends_on:
      - backend
    networks: [internal, edge]
    ports:
      - "127.0.0.1:10890:80"
    logging: *default-logging

volumes:
  production_pgdata:
    name: production_pgdata

networks:
  internal:
    name: production-internal
  edge:
    external: true
    name: foodscanner-edge
