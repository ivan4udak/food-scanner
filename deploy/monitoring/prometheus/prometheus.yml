global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: foodscanner

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter      # метрики хоста (CPU/RAM/диск/сеть)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor           # метрики контейнеров
    static_configs:
      - targets: ["cadvisor:8080"]

  # Spring Boot Actuator (Micrometer) по окружениям. Недоступные цели
  # (например, простаивающий green) Prometheus помечает down — это нормально.
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend-staging:8080"]
        labels: { env: staging }
      - targets: ["backend-production:8080"]
        labels: { env: production }
