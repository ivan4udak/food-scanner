services:

  postgres:
    image: postgres:16-alpine
    container_name: foodscanner-db
    environment:
      POSTGRES_DB: foodscanner
      POSTGRES_USER: foodscanner
      POSTGRES_PASSWORD: foodscanner
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    container_name: foodscanner-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foodscanner
      MINIO_ROOT_PASSWORD: foodscanner123
    ports:
      - "9000:9000"
      - "9001:9001"
