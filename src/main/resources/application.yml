# ═══════════════════════════════════════════════════════════════════
#  Food Scanner — основная конфигурация
#  Все чувствительные параметры переопределяются через:
#    - переменные окружения (SPRING_DATASOURCE_URL и т.п.)
#    - application-prod.yml / application-dev.yml
#    - JVM-аргументы: -Dserver.port=9090
# ═══════════════════════════════════════════════════════════════════

spring:
  application:
    name: food-scanner

  # ── База данных ──────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/foodscanner}
    username: ${DB_USER:foodscanner}
    password: ${DB_PASSWORD:foodscanner}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FoodScannerPool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ──────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway управляет схемой
    open-in-view: false           # отключаем — предотвращает N+1 в контроллерах
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: food_catalog
        format_sql: true
        use_sql_comments: true
        # dialect НЕ указываем — Hibernate 6 определяет сам (убирает HHH90000025)

  # ── Flyway ───────────────────────────────────────────────────────
  flyway:
    enabled: true
    schemas: food_catalog
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ── Сообщения об ошибках ─────────────────────────────────────────
  mvc:
    throw-exception-if-no-handler-found: false   # обрабатываем через GlobalExceptionHandler

  # ── Загрузка файлов (фото продукта) ──────────────────────────────
  servlet:
    multipart:
      max-file-size:    ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}

# ── Админ (сброс паролей) ────────────────────────────────────────────
admin:
  password: ${ADMIN_PASSWORD:admin}

# ── JWT ──────────────────────────────────────────────────────────────
jwt:
  secret:           ${JWT_SECRET:dev-secret-change-me-please-change-me-32b}
  access-ttl-hours: ${JWT_ACCESS_TTL_HOURS:24}
  refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

# ── Очистка мусора (Блок 15) ─────────────────────────────────────────
cleanup:
  draft-ttl-hours: ${CLEANUP_DRAFT_TTL_HOURS:24}
  interval-ms:     ${CLEANUP_INTERVAL_MS:3600000}   # раз в час

# ── Объектное хранилище фото (MinIO / S3-совместимое) ────────────────
storage:
  provider: ${STORAGE_PROVIDER:minio}
  minio:
    endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:foodscanner}
    secret-key: ${MINIO_SECRET_KEY:foodscanner123}
    bucket:     ${MINIO_BUCKET:food-images}

# ── Сервер ──────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:on_param}  # ?trace=true в URL
    include-exception: ${ERROR_INCLUDE_EXCEPTION:false}

# ── Логирование ──────────────────────────────────────────────────────
# Уровни: TRACE < DEBUG < INFO < WARN < ERROR
# Переопределить без перекомпиляции:
#   export LOG_LEVEL_ROOT=DEBUG
#   export LOG_LEVEL_APP=TRACE
#   export LOG_LEVEL_SQL=DEBUG
#   export LOG_LEVEL_WEB=DEBUG
#
logging:
  level:
    root: ${LOG_LEVEL_ROOT:DEBUG}

    # Приложение
    com.foodscanner: ${LOG_LEVEL_APP:DEBUG}
    com.foodscanner.domain: ${LOG_LEVEL_DOMAIN:DEBUG}
    com.foodscanner.application: ${LOG_LEVEL_APPLICATION:DEBUG}
    com.foodscanner.infrastructure: ${LOG_LEVEL_INFRA:DEBUG}
    com.foodscanner.api: ${LOG_LEVEL_API:DEBUG}

    # Spring Web — входящие запросы, маппинг роутов
    org.springframework.web: ${LOG_LEVEL_WEB:TRACE}
    org.springframework.web.servlet.DispatcherServlet: ${LOG_LEVEL_WEB:TRACE}
    org.springframework.web.servlet.mvc.method.annotation: ${LOG_LEVEL_WEB:DEBUG}

    # SQL запросы (show-sql=true + этот уровень = полные запросы с параметрами)
    org.hibernate.SQL: ${LOG_LEVEL_SQL:TRACE}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL_PARAMS:DEBUG}    # значения параметров
    org.hibernate.orm.jdbc.extract: ${LOG_LEVEL_SQL_PARAMS:DEBUG} # результаты

    # HikariCP — пул соединений
    com.zaxxer.hikari: ${LOG_LEVEL_HIKARI:TRACE}
    com.zaxxer.hikari.HikariConfig: ${LOG_LEVEL_HIKARI:DEBUG}

    # Flyway
    org.flywaydb: ${LOG_LEVEL_FLYWAY:DEBUG}

    # Spring Data / JPA
    org.springframework.data: ${LOG_LEVEL_DATA:DEBUG}
    org.springframework.orm.jpa: ${LOG_LEVEL_JPA:DEBUG}
    org.springframework.transaction: ${LOG_LEVEL_TX:DEBUG}

  # Формат строки лога
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p){} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n%wEx"

  # Файл лога (опционально, по умолчанию выключен)
  file:
    name: ${LOG_FILE:}              # пусто = только консоль; задай путь чтобы включить
    max-size: ${LOG_FILE_MAX_SIZE:50MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}

# ── Actuator (health-check) ──────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
      base-path: /actuator
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true   # /actuator/health/liveness|readiness
  metrics:
    tags:
      application: food-scanner
      env: ${APP_ENV:local}    # staging|preprod|production — разделение в Grafana
  prometheus:
    metrics:
      export:
        enabled: ${PROMETHEUS_ENABLED:true}
