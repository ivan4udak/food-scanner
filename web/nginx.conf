# Шаблон nginx (обрабатывается официальным образом nginx через envsubst).
# ${BACKEND_URL} подставляется из переменной окружения контейнера; $uri/$host и
# прочие nginx-переменные не входят в окружение и остаются как есть.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Service worker / manifest — без агрессивного кэша, чтобы обновления доходили.
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html       { add_header Cache-Control "no-cache"; }

    # Хэшированные ассеты Vite — иммутабельный долгий кэш.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Проксирование к backend (/api/v1). За Caddy этот путь обычно не используется
    # (Caddy сам маршрутизирует /api на активный backend), поэтому upstream задаётся
    # через ПЕРЕМЕННУЮ + resolver: nginx НЕ резолвит хост на старте и не падает,
    # если backend (напр. backend-blue в blue-green) ещё/уже не существует.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;   # встроенный DNS Docker
        set $fs_backend "${BACKEND_URL}";
        proxy_pass $fs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # загрузка фото
        proxy_read_timeout 60s;
    }

    # SPA: все остальные пути отдают index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
