# Шаблон nginx (обрабатывается официальным образом nginx через envsubst).
# ${BACKEND_URL} подставляется из переменной окружения контейнера; $uri/$host и
# прочие nginx-переменные не входят в окружение и остаются как есть.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Service worker / manifest — без агрессивного кэша, чтобы обновления доходили.
    location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /registerSW.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /index.html       { add_header Cache-Control "no-cache"; }

    # Хэшированные ассеты Vite — иммутабельный долгий кэш.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Проксирование к существующему backend (/api/v1) без изменения API.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;   # загрузка фото
        proxy_read_timeout 60s;
    }

    # SPA: все остальные пути отдают index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
