# ═══════════════════════════════════════════════════════════════════
#  Food Scanner — конфигурация сервиса
#  Файл читается install.sh при установке и start.sh при запуске.
#  Изменения применяются после перезапуска: ./scripts/restart.sh
# ═══════════════════════════════════════════════════════════════════

# ── Сервер ───────────────────────────────────────────────────────
SERVER_PORT=8080

# ── База данных ──────────────────────────────────────────────────
DB_URL="jdbc:postgresql://localhost:5432/foodscanner"
DB_USER="foodscanner"
DB_PASSWORD="foodscanner"
DB_POOL_SIZE=10

# ── Логирование ──────────────────────────────────────────────────
# Уровни: TRACE DEBUG INFO WARN ERROR
#
# Корневой уровень (всё что не переопределено ниже)
LOG_LEVEL_ROOT=TRACE

# Приложение
LOG_LEVEL_APP=TRACE

# Отдельные слои (раскомментировать для детализации)
# LOG_LEVEL_DOMAIN=DEBUG
# LOG_LEVEL_APPLICATION=DEBUG
# LOG_LEVEL_INFRA=DEBUG
# LOG_LEVEL_API=DEBUG

# HTTP — входящие запросы, маппинг, статусы ответов
LOG_LEVEL_WEB=TRACE

# SQL — раскомментировать чтобы видеть все запросы в БД
# LOG_LEVEL_SQL=DEBUG
# LOG_LEVEL_SQL_PARAMS=TRACE   # значения параметров (пароли и т.п. — осторожно!)

# Транзакции
# LOG_LEVEL_TX=DEBUG

# HikariCP (пул соединений)
LOG_LEVEL_HIKARI=TRACE

# Flyway (миграции)
LOG_LEVEL_FLYWAY=TRACE

# ── Файл лога ────────────────────────────────────────────────────
# Пусто = только консоль. Задайте путь чтобы писать в файл.
LOG_FILE="logs/food-scanner.log"
LOG_FILE_MAX_SIZE=50MB
LOG_FILE_MAX_HISTORY=30     # дней

# ── Spring профиль ───────────────────────────────────────────────
# default | dev | trace
# dev   = DEBUG логи приложения + SQL
# trace = TRACE всё включая параметры SQL и транзакции
SPRING_PROFILE=trace

# ── JVM ──────────────────────────────────────────────────────────
JAVA_OPTS="-Xms256m -Xmx512m -XX:+UseG1GC"

# ── Путь к JAR (относительно корня проекта) ─────────────────────
JAR_PATH="target/food-scanner-1.0.0-SNAPSHOT.jar"

# ── PID файл ─────────────────────────────────────────────────────
PID_FILE="/tmp/food-scanner.pid"
