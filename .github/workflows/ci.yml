name: CI

# Проверки на dev и во всех PR: тесты + сборка (без деплоя и без публикации образов).
on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests (mvn verify)
        run: mvn -B verify
      - name: Package (sanity)
        run: mvn -B package -DskipTests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test
      - name: Build (tsc + vite)
        run: npm run build
